# 飞盘相关性词典
#
# 打分逻辑见 frisbee_radar/relevance.py：
#   score = sum(命中权重) / 归一化基准
# 命中任一 negative 词会直接判定为「无关」，无论 core 命中多少。
#
# 调参建议：先跑 `python run.py crawl --source mock --dry-run`
# 看打分分布，再回到这里增删词。

# 核心词：几乎只出现在飞盘语境里，权重高
core:
  - 飞盘
  - 飛盤
  - frisbee
  - ultimate frisbee
  - 极限飞盘
  - 飛盤爭奪賽
  - 掷准飞盘
  - 飛盤高爾夫
  - disc golf
  - 飞盘高尔夫
  - 躲避飞盘
  - 飛盤狗
  - 飞盘狗
  - 花式飞盘
  - 飞盘争夺赛

# 相关词：需要和核心词共现才计分，单独出现不加分
related:
  - WFDF
  - UFA
  - AUDL
  - USAU
  - 世界飞盘联合会
  - 中国飞盘联赛
  - 全国飞盘运动推广委员会
  - 飞盘俱乐部
  - 飞盘联赛
  - 飞盘培训
  - 飞盘教练
  - 盘龄
  - 开盘
  - 接盘
  - 传盘
  - 长传
  - 短传
  - 得分区
  - 端区
  - 读盘
  - 甩盘
  - 盘友
  - 极限运动
  - 腰旗橄榄球
  - 匹克球
  - 露营
  - 桨板
  - 陆冲

# 负向词：命中即判定无关（用于过滤「飞盘」作为其他含义出现的情况）
# 注意：中文「飞盘」还可能指 电脑硬盘「磁盘」的口误、以及车评里的「飞盘」
negative:
  - 硬盘
  - 磁盘阵列
  - 硬盘盒
  - SSD
  - 机械硬盘
  - 飞盘乱飞
  # 术数语境里也有「飞盘」（实测撞到一篇奇门遁甲文章讲「鸣法飞盘」，
  # 是术语同名，跟飞盘运动无关）
  - 奇门
  - 遁甲
  - 六爻
  - 八字
  - 紫微
  - 风水
  - 占卜
  - 算命

# 强相关阈值：score >= 此值判定为「飞盘相关」
#
# 注意 0.5 这个默认值的实际含义：它等价于「标题必须命中核心词」。
# 因为标题命中 = 0.60，而正文单独命中只有 0.25，够不到 0.5。
# 这是刻意的精度优先策略——否则一篇泛泛的《周末运动推荐》里
# 提一句飞盘也会被捞进来。
# 如果你希望「正文提到就算」，把这里调到 0.25。
threshold: 0.5

# 单篇最多保留条数（按平台），防止刷屏
per_platform_limit: 100
