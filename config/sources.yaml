# 采集目标配置
#
# 每个 source 可以同时配 keywords（关键词搜索）和 accounts（账号监控）。
# 两种模式抓到的内容会统一进库、统一去重、统一算相关性。

# 全局采集行为
crawl:
  # 每个关键词/账号最多抓多少条
  limit_per_target: 30
  # 请求间隔（秒），随机抖动范围，别调太小
  delay_min: 3.0
  delay_max: 7.0
  # 连续失败多少次后放弃该平台
  max_failures: 3
  # 只保留最近 N 天的内容（0 = 不限制）
  since_days: 30

wechat:
  enabled: true
  # sogou  = 搜狗微信搜索，免登录、可立即跑，但只覆盖近期+相关性靠前的文章
  # mp     = 微信公众平台后台接口，需扫码登录，可抓指定公众号完整历史
  mode: sogou
  keywords:
    # 教学/技巧导向的关键词单独列出来。实测只搜「飞盘」的话，搜狗返回的
    # 几乎全是 2022 年那批媒体评论（「飞盘火了/凉了」），一条教学都没有；
    # 想要「训练与技巧」这个分类有内容，必须用下面这几个词去搜。
    - 飞盘教学
    - 飞盘技巧
    - 飞盘训练
    - 飞盘新手入门
    - 飞盘规则
    - 飞盘
    - 极限飞盘
    - 飞盘联赛
    - 飞盘俱乐部
    - 飞盘高尔夫
    - 掷准飞盘
  # mode=mp 时生效：要监控的公众号名称（程序会自动搜索拿 fakeid）
  accounts:
    - 中国飞盘联赛
    - 飞盘世界
    - 全国飞盘运动推广委员会
  # 说明：搜狗按「相关性」排序返回，且已废弃时间范围过滤参数（带上反而
  # 抓不到东西，见 sources/wechat.py 里的注释）。所以搜狗模式一次能拿到
  # 的是「跟飞盘最相关的一批文章」，里面会有 2016~2023 年的老内容。
  # 时间筛选请在出报告时做：python run.py report --days 30

# ============================================================
# 增量产出（watch 命令）
# ============================================================
# 定时跑 `python run.py watch`：采集 → 看有没有新内容 → 有才出简报。
# 每条内容只会进一份简报，进过就标记，不会重复产出。
watch:
  # 权威公众号：这些号一发推送就立刻出简报，不用等其他号凑数。
  # 名字要和采集到的 author 字段完全一致（可跑 `python run.py authors` 查）。
  # 注意 sogou 模式下只有被搜狗收录的号才能按名字抓到，实测
  # 「全国飞盘运动推广委员会」可以，「中国飞盘联赛」不行。
  authoritative:
    - 全国飞盘运动推广委员会
  # 普通来源累计多少条新内容才出简报
  trigger_min_new: 8
  # 两次简报之间的最短间隔（小时）。0 = 不限，有新内容就出。
  min_interval_hours: 6
  # 权威号有新内容时，是否无视上面的最短间隔立刻产出
  authoritative_breaks_interval: true

# ============================================================
# 内容分类与取舍
# ============================================================
# 日报只收录命中下面任一分类的内容。命中不了的（媒体评论、行业分析、
# 装备种草、蹭热点）直接不进日报——这是白名单，不是排序偏好。
#
# 匹配规则（见 frisbee_radar/categories.py）：
#   1. 标题命中 exclude 里的词 → 直接不要，连 include 都不看
#   2. 标题命中 include 里的词 → 归入该分类
#   3. 分类按 order 从小到大排，第一个命中的胜出
#
# exclude 是关键：没有它，「一个神秘掷准飞盘俱乐部现身」会被「掷准」
# 拉进训练，36氪虎嗅那种「评论俱乐部现象」的稿子会被「俱乐部」
# 拉进队伍动态。这两类误判都是实测踩出来的。
category_match:
  # 只看标题（0 = 关闭正文兜底）。精度优先。
  # 实测开启后，新京报那种媒体科普稿会因为正文出现「教练」「新手」
  # 被误收进「训练与技巧」，所以默认关掉。
  body_min_hits: 0
  # 跨分类一律排除（硬盘误匹配之类，和 keywords.yaml 的 negative 互为保险）
  global_exclude:
    - 硬盘
    - 磁盘
    - SSD

categories:
  - key: training
    name: 训练与技巧
    order: 1
    intro: 教学、动作要领、战术配合——可以直接拿去练或拿去用的内容。
    # 词表分两批：前半是公众号的书面说法（教学/教程/要领），
    # 后半是小红书的说法（小知识/站姿/步伐/打法）—— 实测两边的词汇
    # 几乎不重叠，只按公众号的词表配会把小红书的干货全漏掉。
    include:
      - 教学
      - 教程
      - 技巧
      - 训练
      - 训练营
      - 入门
      - 基本功
      - 要领
      - 误区
      - 反手
      - 正手
      - 传盘
      - 接盘
      - 抛盘
      - 甩盘
      - 战术
      - 阵型
      - 跑位
      - 走位
      - 规则
      - 盘感
      - 教练员
      - 培训
      - 教学视频
      - 怎么练
      - 如何练
      - 怎么打
      - 如何打
      - 练习
      - 手法
      - 步法
      - 体能
      - 热身
      - 拉伸
      # ↓ 小红书/短视频常用的说法
      - 小知识
      - 知识
      - 秘密
      - 站姿
      - 步伐
      - 手腕
      - 新手
      - 新人
      - 必学
      - 打法
      - 扔盘
      - 出盘
      - 掷盘
      - 接不稳
      - 飞不远
      - 进阶
      - 掌握
      - 学会
      - 姿势
      - 教练
    # 带这些词的是队伍/赛事语境，不是教学
    exclude:
      - 俱乐部
      - 战队
      - 校队
      - 联赛
      - 公开赛
      - 锦标赛
      - 招新
      - 迎新
      - 周年
      - 高校
      - 大学
      - 学院
      # 飞盘狗（训犬）是另一个项目，不是人的飞盘训练。
      # 实测「飞盘训练出一流的狗狗」「边牧飞盘训练」这类会靠「训练」混进来。
      # 注意要连犬种简称一起排——「边牧」「德牧」里没有「犬」字。
      - 狗狗
      - 犬
      - 宠物
      - 飞盘狗
      - 训犬
      - 边牧
      - 德牧
      - 牧羊犬
      # 游戏里的「飞盘射击」不是飞盘运动
      - 射击
      - 手游
      - 游戏

  - key: team
    name: 队伍与赛事动态
    order: 2
    intro: 俱乐部、校队、联赛的日常与赛况。
    include:
      - 招新
      - 迎新
      - 纳新
      - 招募
      - 我校
      - 本院
      - 队内
      - 日常
      - 纪实
      - 侧记
      - 总结
      - 交流赛
      - 友谊赛
      - 冠军赛
      - 公开赛
      - 锦标赛
      - 邀请赛
      - 联赛
      - 省赛
      - 国赛
      - 夺冠
      - 获佳绩
      - 成立
      - 周年
      - 换届
      - 组队
      - 参赛
      - 约局
      - 俱乐部
      - 战队
      - 校队
      - 队伍
      - 球队
      - 队员
      - 队长
      - 高校
      - 大学
      - 学院
      - 协会
