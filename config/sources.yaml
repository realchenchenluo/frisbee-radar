# ============================================================
# 产出
# ============================================================
output:
  # 产出目录。沿用「X抓取信息 → 每日X记录」那套习惯：文档放桌面单独
  # 文件夹，一眼能看到，不用翻进项目目录里找。
  dir: "D:/Desktop/每日飞盘记录"
  # {date} 会被替换成 YYYY-MM-DD
  filename: "{date}_飞盘日报.docx"
  # 同时落一份原始数据，便于回溯
  also_json: true
  # 简报标题
  title: 飞盘日报
  # 单份最多收录多少条。超出的留到下一份，不会丢。
  # 120 是给「第一次跑、要把攒下的存量一次性出完」留的余量；
  # 之后进入增量模式，每份通常只有几条到几十条。
  max_items: 120

# ============================================================
# 静态网页发布
# ============================================================
# 架构：本地抓取 → 生成静态站 → 推 GitHub → Pages 永久托管。
#
# 为什么不直接部署一个后端服务：小红书/抖音的接口都要页面自己算签名
# （x-s / a_bogus），必须有浏览器内核；还要登录态；而且机房 IP 会被拦
# —— GitHub Actions 那种数据中心 IP 基本抓不到东西。所以抓取只能在
# 你本机跑，网页部分做成静态的托管到 Pages。
publish:
  # 站点标题
  title: 飞盘讯息聚合
  # 生成到哪个目录。必须是仓库内相对路径 —— GitHub Pages 要指到这里。
  # docs 是 Pages 最常用的约定（Settings → Pages → Source 选 main 的 /docs）
  dir: docs
  # 推送用的分支
  branch: main
  # Cloudflare Pages 项目名。填了就额外往 Cloudflare 部署一份，
  # 网址 https://<项目名>.pages.dev —— 不含 GitHub 用户名，比
  # realchenchenluo.github.io/frisbee-radar/ 好看。
  # 留空则只推 GitHub。
  # 部署走 `npx wrangler pages deploy`，需要先跑过一次 npx wrangler login。
  cloudflare_project: feipannews


# ============================================================
# 全局：用你自己的浏览器（可选，推荐）
# ============================================================
# 默认是「开一个本项目专用的 Chromium，扫码登录一次」。
# 但更省事的做法是复用你平时那个浏览器里**已经登录好的**会话：
#
#   1. 双击「7-用我的浏览器.bat」——它会用调试端口启动你的浏览器
#      （需要先关掉现有的浏览器窗口，同一个 profile 不能开两个实例）
#   2. 在启动出来的浏览器里正常登录一遍各平台（只需一次）
#   3. 采集时就会直接复用这些登录态，不用扫码
#
# 下面每个平台的 cdp_url 填上就启用这个模式；留空走默认的独立 Chromium。
# 地址固定是 http://127.0.0.1:9222（bat 里的 PORT）。
#
# 也可以临时用命令行指定：python run.py login --platform xiaohongshu --cdp http://127.0.0.1:9222

# ============================================================
# 微信视频号（微信小视频）
# ============================================================
# ⚠️ 这个平台和另外三个不一样，先读这里再开：
#
# 1. 必须微信扫码登录。实测未登录时 channels.weixin.qq.com 只剩一个加载
#    指示器，body 里一个字都没有，内容接口完全不触发。
# 2. 它没有公开的内容搜索接口，GitHub 上的现成方案要么是下载器（挂微信
#    PC 客户端抓视频文件），要么走付费第三方 API。所以采集器是靠
#    「响应特征匹配 + 通用 JSON 遍历」来提取的，不是写死接口路径。
# 3. 因此字段可能取不全，搜索页地址也是试出来的候选值。
#
# 建议流程：先跑 `python run.py login --platform wechat_channels` 扫码，
# 再跑 `python run.py probe --platform wechat_channels --keyword 飞盘`，
# 它会把真实请求到的接口和响应落盘，据此把地址/字段对齐。
wechat_channels:
  # 默认关闭：没登录的话开了只会报错，等扫码验证过再改成 true
  enabled: false
  keywords:
    - 飞盘
    - 极限飞盘
    - 飞盘教学
    - 飞盘技巧
    - 飞盘俱乐部
  accounts: []
  # 登录态探测方式见 frisbee_radar/browser.py 的 LOGIN_BY_CONTENT
  headless: false

# ============================================================
# 小红书
# ============================================================
xiaohongshu:
  enabled: true
  # 关键词搜索（推荐）
  keywords:
    - 飞盘
    - 极限飞盘
    - 飞盘入门
    - 飞盘俱乐部
    - 飞盘约局
    - 飞盘穿搭
    - 飞盘教学
    - 飞盘技巧
  # 账号监控：填小红书号(red_id) 或 主页链接
  accounts: []
  # 排序: general(综合) | time_descending(最新) | popularity_descending(最热)
  sort: time_descending
  # 采集时不显示浏览器窗口。
  # 实测显示窗口模式下 goto 常常等不到 domcontentloaded 而超时（页面有持续
  # 加载的资源），无窗口模式更稳。登录仍然是有窗口的（login 命令单独控制）。
  headless: true
  # 填上就用你自己的浏览器（见文件上方「用你自己的浏览器」说明）
  cdp_url: ""

douyin:
  enabled: true
  keywords:
    - 飞盘
    - 极限飞盘
    - 飞盘联赛
    - 飞盘教学
  # 账号监控：填抖音号 或 主页链接(含 sec_uid)
  accounts: []
  # 排序: 0=综合 1=最新 2=最热
  sort_type: 1
  headless: false
  # 填上就用你自己的浏览器（见文件上方「用你自己的浏览器」说明）
  cdp_url: ""
